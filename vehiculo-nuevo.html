<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151719">
  <title>Agregar vehículo | GARAGE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="vehiculo-nuevo">
  <header class="app-header"><div class="container app-header__container">
    <a class="app-brand" href="index.html"><span class="app-brand__logo">G</span>
      <span class="app-brand__name">GARAGE</span></a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a class="main-nav__link" href="index.html">Inicio</a>
      <a class="main-nav__link main-nav__link--active" href="vehiculos.html">Mi garaje</a>
      <a class="main-nav__link" href="mantenimiento.html">Mantenimiento</a>
      <a class="main-nav__link" href="economia.html">Gastos</a>
    </nav>
  </div>
</header>

  <main class="container app-main app-main--narrow">
    <div class="page-heading">
      <div>
        <p class="page-heading__eyebrow">MI GARAJE</p>
        <h1 class="page-heading__title">Agregar vehículo</h1>
        <p class="page-heading__text">Completá los datos principales de tu vehículo.</p>
      </div>
    </div>
    <section class="form-card">
      <form id="form-vehiculo">
        <div class="mb-3">
          <label class="form-label" for="marca">Marca</label>
          <input class="form-control" type="text" id="marca" name="marca" placeholder="Ej.: Ford" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="modelo">Modelo</label>
          <input class="form-control" type="text" id="modelo" name="modelo" placeholder="Ej.: Fiesta Kinetic" required>
        </div>
        <div class="row g-3">
          <div class="col-12 col-sm-6">
            <label class="form-label" for="anio">Año</label>
            <input class="form-control" type="number" id="anio" name="anio" min="1950" max="2026" placeholder="Ej.: 2011" required>
          </div>
          <div class="col-12 col-sm-6">
            <label class="form-label" for="kilometros">Kilometraje</label>
            <input class="form-control" type="number" id="kilometros" name="kilometros" min="0" placeholder="Ej.: 120000" required>
          </div>
        </div>
        <div class="mt-4 d-flex flex-column flex-sm-row gap-2">
          <button class="btn btn-garage" type="submit">Guardar vehículo</button>
          <a class="btn btn-outline-light" href="vehiculos.html">Cancelar</a>
        </div>
      </form>
      <p id="mensaje-vehiculo" class="form-message" role="status"></p>
    </section>
  </main>
  <footer class="app-footer"><div class="container">
    <p>GARAGE · Versión 0.1</p>
  </div>
</footer>
  <script src="js/app.js"></script>
</body>
</html>
