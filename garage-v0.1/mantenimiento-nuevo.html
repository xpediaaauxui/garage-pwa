<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151719">
  <title>Nuevo mantenimiento | GARAGE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="mantenimiento-nuevo">
  <header class="app-header">
    <div class="container app-header__container">
      <a class="app-brand" href="index.html">
        <span class="app-brand__logo">G</span>
        <span class="app-brand__name">GARAGE</span>
      </a>
      <nav class="main-nav" aria-label="Navegación principal">
        <a class="main-nav__link" href="index.html">Inicio</a>
        <a class="main-nav__link" href="vehiculos.html">Mi garaje</a>
        <a class="main-nav__link main-nav__link--active" href="mantenimiento.html">Mantenimiento</a>
        <a class="main-nav__link" href="economia.html">Gastos</a>
      </nav>
    </div>
  </header>
  <main class="container app-main app-main--narrow">
    <div class="page-heading">
      <div>
        <p class="page-heading__eyebrow">MANTENIMIENTO</p>
        <h1 class="page-heading__title">Nuevo registro</h1>
        <p class="page-heading__text">Elegí el vehículo y anotá qué trabajo realizaste.</p>
      </div>
    </div>

    <section class="form-card">
      <form id="form-mantenimiento">
        <div class="mb-3">
          <label class="form-label" for="vehiculo-mantenimiento">Vehículo</label>
          <select class="form-select" id="vehiculo-mantenimiento" required>
            <option value="">Seleccionar vehículo</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="servicio">Trabajo realizado</label>
          <input class="form-control" type="text" id="servicio" placeholder="Ej.: Cambio de aceite" required>
        </div>

        <div class="row g-3">
          <div class="col-12 col-sm-6">
            <label class="form-label" for="fecha-mantenimiento">Fecha</label>
            <input class="form-control" type="date" id="fecha-mantenimiento" required>
          </div>
          <div class="col-12 col-sm-6">
            <label class="form-label" for="km-mantenimiento">Kilometraje</label>
            <input class="form-control" type="number" id="km-mantenimiento" min="0" placeholder="Ej.: 120000" required>
          </div>
        </div>
        <div class="mt-4 d-flex flex-column flex-sm-row gap-2">
          <button class="btn btn-garage" type="submit">Guardar registro</button>
          <a class="btn btn-outline-light" href="mantenimiento.html">Cancelar</a>
        </div>
    
      </form>
      <p id="mensaje-mantenimiento" class="form-message" role="status"></p>
    </section>
  </main>
  <footer class="app-footer"><div class="container"><p>GARAGE · Versión 0.1</p>
  </div>
</footer>
<script src="js/app.js"></script>
</body>
</html>
